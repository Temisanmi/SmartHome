<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Add Device</title>
        <th:block th:replace="~{fragments/head :: favicon}"></th:block>
        <link rel="stylesheet" th:href="@{/css/auth.css}">
    </head>

    <body>
        <div class="auth-page">
            <div class="auth-hero">
                <div class="hero-content">
                    <h1>Wire up<br>a new device.</h1>
                    <p class="hero-tagline">Add it to <span th:text="${room.name}">this room</span>, and it's ready to control and automate right away.</p>

                    <div class="device-network">
                        <svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <line class="net-line active" x1="220" y1="165" x2="220" y2="40"/>
                            <line class="net-line" x1="220" y1="165" x2="339" y2="126"/>
                            <line class="net-line active" x1="220" y1="165" x2="294" y2="266"/>
                            <line class="net-line" x1="220" y1="165" x2="146" y2="266"/>
                            <line class="net-line" x1="220" y1="165" x2="101" y2="126"/>

                            <g class="net-node hub"><circle cx="220" cy="165" r="16"/></g>
                            <g class="net-node on"><circle class="ring" cx="220" cy="40" r="11"/><circle class="core" cx="220" cy="40" r="6"/></g>
                            <g class="net-node off"><circle class="ring" cx="339" cy="126" r="11"/><circle class="core" cx="339" cy="126" r="6"/></g>
                            <g class="net-node on"><circle class="ring" cx="294" cy="266" r="11"/><circle class="core" cx="294" cy="266" r="6"/></g>
                            <g class="net-node off"><circle class="ring" cx="146" cy="266" r="11"/><circle class="core" cx="146" cy="266" r="6"/></g>
                            <g class="net-node off"><circle class="ring" cx="101" cy="126" r="11"/><circle class="core" cx="101" cy="126" r="6"/></g>
                        </svg>
                    </div>

                    <p class="hero-support">It'll show up on your dashboard immediately, ready for schedules and manual control.</p>
                </div>
            </div>

            <div class="auth-panel">
                <div class="auth-container">
                    <div class="hero-mark"><img th:src="@{/images/logo-mark.png}" alt="Smart Home logo" class="hero-logo">SMART HOME · CONTROL CENTER</div>
                    <h2>Add a Device</h2>
                    <p class="subtitle">
                        To <span th:text="${room.name}">Room</span>
                    </p>

                    <form th:action="@{/devices/add}" method="post" class="auth-form">
                        <input type="hidden" name="roomId" th:value="${room.id}">

                        <label for="name">Device Name</label>
                        <input type="text" id="name" name="name" placeholder="e.g. Ceiling Light" required>

                        <label for="deviceType">Device Type</label>

                        <select id="deviceType" name="deviceType" required>
                            <option value="AC">Air Conditioner</option>
                            <option value="CURTAIN">Curtain</option>
                            <option value="GATE">Gate</option>
                            <option value="FRIDGE">Refrigerator</option>
                            <option value="FAN">Smart Fan</option>
                            <option value="LIGHT">Smart Light</option>
                            <option value="LOCK">Smart Lock</option>
                            <option value="TV">Smart TV</option>
                            <option value="WINDOW">Smart Window</option>
                            <option value="THERMOSTAT">Thermostat</option>
                            <option value="WATERHEATER">Water Heater</option>
                        </select>

                        <button type="submit">Add Device</button>
                    </form>

                    <p class="switch-link">
                        <a th:href="@{/dashboard}">Back to Dashboard</a>
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
