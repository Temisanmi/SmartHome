<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <title>Verify Code</title>
    <th:block th:replace="~{fragments/head :: favicon}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
  </head>

  <body>
    <div class="auth-page">

      <div class="auth-hero">
        <div class="hero-content">
          <h1>One code<br>from safe.</h1>
          <p class="hero-tagline">Your password checked out — just confirm it's really you.</p>

          <div class="device-network">
            <svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <line class="net-line active" x1="220" y1="165" x2="220" y2="40"/>
              <line class="net-line" x1="220" y1="165" x2="339" y2="126"/>
              <line class="net-line active" x1="220" y1="165" x2="294" y2="266"/>
              <line class="net-line" x1="220" y1="165" x2="146" y2="266"/>
              <line class="net-line" x1="220" y1="165" x2="101" y2="126"/>

              <g class="net-node hub"><circle cx="220" cy="165" r="16"/></g>
              <g class="net-node on"><circle class="ring" cx="220" cy="40" r="11"/><circle class="core" cx="220" cy="40" r="6"/></g>
              <g class="net-node off"><circle class="ring" cx="339" cy="126" r="11"/><circle class="core" cx="339" cy="126" r="6"/></g>
              <g class="net-node on"><circle class="ring" cx="294" cy="266" r="11"/><circle class="core" cx="294" cy="266" r="6"/></g>
              <g class="net-node off"><circle class="ring" cx="146" cy="266" r="11"/><circle class="core" cx="146" cy="266" r="6"/></g>
              <g class="net-node off"><circle class="ring" cx="101" cy="126" r="11"/><circle class="core" cx="101" cy="126" r="6"/></g>
            </svg>
          </div>

          <p class="hero-support">The code was sent to your console and stays valid for 1 minute.</p>
        </div>
      </div>

      <div class="auth-panel">
        <div class="auth-container">
          <div class="hero-mark"><img th:src="@{/images/logo-mark.png}" alt="Smart Home logo" class="hero-logo">SMART HOME · CONTROL CENTER</div>
          <h2>Verify your login</h2>
          <p class="subtitle">Enter the code from your console</p>

          <p class="subtitle" style="color: #ef4444;" th:if="${error}" th:text="${error}"></p>

          <form id="otp-form" th:action="@{/verify-otp}" method="post" class="auth-form">
            <label>6-digit code</label>
            <div class="otp-inputs">
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" autofocus aria-label="Digit 1 of 6">
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2 of 6">
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3 of 6">
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4 of 6">
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5 of 6">
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6 of 6">
            </div>
            <input type="hidden" id="code" name="code">
            <button type="submit">Verify</button>
          </form>

          <form th:action="@{/verify-otp/resend}" method="post">
            <button type="submit" style="background:none;border:none;color:var(--amber);cursor:pointer;margin-top:10px;">Resend code</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var boxes = Array.from(document.querySelectorAll('.otp-box'));
        var hidden = document.getElementById('code');

        function syncHidden() {
          hidden.value = boxes.map(function (b) { return b.value; }).join('');
        }

        boxes.forEach(function (box, index) {
          box.addEventListener('input', function () {
            box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
            if (box.value && index < boxes.length - 1) {
              boxes[index + 1].focus();
            }
            syncHidden();
          });

          box.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && !box.value && index > 0) {
              boxes[index - 1].focus();
              boxes[index - 1].value = '';
              syncHidden();
            }
          });

          box.addEventListener('paste', function (e) {
            e.preventDefault();
            var pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
            for (var i = 0; i < boxes.length; i++) {
              boxes[i].value = pasted[i] || '';
            }
            var lastFilled = Math.min(pasted.length, boxes.length) - 1;
            if (lastFilled >= 0) boxes[lastFilled].focus();
            syncHidden();
          });
        });

        document.getElementById('otp-form').addEventListener('submit', syncHidden);
      })();
    </script>
  </body>
</html>
